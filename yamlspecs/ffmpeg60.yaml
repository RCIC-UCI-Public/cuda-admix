## Build the 60 versions of libraries for CUDA
!include ffmpeg-common.yaml
---
- version: "{{versions.ffmpeg60}}"
  cuda_name: cuda
  cuda_version: "{{versions.cuda.major}}.{{versions.cuda.minor}}.{{versions.cuda.subrelease}}"
  release: 1
  opt10: !OScmp ">=,10,--disable-inline-asm --disable-doc,"
  build:
     modules:
       - "{{versions.compiler.name}}/{{versions.compiler.version}}"
       - "{{cuda_name}}/{{cuda_version}}"
       - ffnvcodec/{{versions.ffnvcodec}}
     configure_args: >
       --disable-vulkan --enable-shared {{opt10}} --enable-nonfree --enable-cuda-nvcc --enable-libnpp --disable-x86asm --extra-cflags=-I$$CUDA_PATH/include --prefix={{root}}
