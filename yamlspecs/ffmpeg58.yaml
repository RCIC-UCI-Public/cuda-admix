## Build the 58 versions of libraries for CUDA
!include ffmpeg-common.yaml
---
- version: "{{versions.ffmpeg58}}"
  opt10: !eval "'--disable-inline-asm --disable-doc' if int({{versions.os_release}}) >= 10 else ''"
  build:
     configure_args: --enable-shared {{opt10}} --disable-yasm --prefix={{root}}
