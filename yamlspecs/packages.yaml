---
system:
   - libaio-devel
   - openmpi-devel
   - SDL-devel
   - SDL2-devel
bootstrap_cuda:
   - cuda-toolkit
   - cuda-module
   - cuda-toolkit-static-libs
   - cuda-toolkit-nsight
bootstrap:
   - !OScmp ">=, 10, libtiff-so libtiff libtiff-module, "
build:
manifest:
   - "{{bootstrap}}"
   - "{{build}}"
sets:
  - !OScmp "<,9,101,"
  - "114"
  - "117"
  - "122"
  - "130"
